# ---------------------------------------------------------------------------
# Gradle / Android build tuning
# ---------------------------------------------------------------------------
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
# Enable after the first green CI run: AGP 8.7 supports it, but it makes
# first-time build errors harder to read.
org.gradle.configuration-cache=false
org.gradle.configureondemand=false

# AndroidX is mandatory for Compose.
android.useAndroidX=true
android.nonTransitiveRClass=true
android.enableJetifier=false

# Kotlin
kotlin.code.style=official
kotlin.incremental=true
ksp.incremental=true
ksp.useKSP2=false

# Set this (or use local.properties) if the SDK lives somewhere unusual.
# sdk.dir=/opt/android-sdk

# Default API base URL baked into BuildConfig. Override per machine with
#   ./gradlew assembleDebug -Psearchhh.apiBaseUrl=http://192.168.0.10:8000/
searchhh.apiBaseUrl=http://10.0.2.2:8000/
