[project]
name = "searchhh-backend"
version = "0.1.0"
requires-python = ">=3.11"

[tool.ruff]
target-version = "py311"
line-length = 120
exclude = [".venv", "android", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "ASYNC", "S", "N", "RUF"]
ignore = ["E501", "B008", "S101", "RUF001", "RUF002", "RUF003", "N818"]

[tool.ruff.lint.per-file-ignores]
"backend/tests/*" = ["S105", "S106", "S311"]
"backend/app/config.py" = ["S104", "S105"]
"backend/app/api/routes/auth.py" = ["S105"]
"backend/app/models/schemas.py" = ["S105"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
ignore_missing_imports = true
mypy_path = "backend"
exclude = [".venv", "android", "build", "dist"]

[tool.coverage.run]
source = ["backend/app"]
branch = true

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
