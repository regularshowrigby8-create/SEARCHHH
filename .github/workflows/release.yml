# ---------------------------------------------------------------------------
# Release - triggered by a version tag (v1.0.0) or manually.
#
# Always builds a debug APK (installable, debug-signed).
# Builds a release APK only when the signing secrets are configured:
#   KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
# ---------------------------------------------------------------------------
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version label for the artifact (e.g. 1.0.0-rc1)"
        required: false
        default: "manual"

permissions:
  contents: write

jobs:
  apk:
    name: Build and publish APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Configure signing (optional)
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/searchhh-release.jks"
            cat > android/keystore.properties <<PROPS
          storeFile=../searchhh-release.jks
          storePassword=${KEYSTORE_PASSWORD}
          keyAlias=${KEY_ALIAS:-searchhh}
          keyPassword=${KEY_PASSWORD:-$KEYSTORE_PASSWORD}
          PROPS
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "Release signing configured."
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "No KEYSTORE_BASE64 secret - releasing the debug APK only."
          fi

      - name: Assemble debug APK
        working-directory: android
        run: gradle :app:assembleDebug --stacktrace

      - name: Assemble signed release APK
        if: steps.signing.outputs.available == 'true'
        working-directory: android
        run: gradle :app:assembleRelease --stacktrace

      - name: Collect artifacts
        run: |
          mkdir -p out
          VERSION="${{ github.ref_name }}"
          if [ "${{ steps.signing.outputs.available }}" = "true" ] && [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            cp android/app/build/outputs/apk/release/app-release.apk "out/searchhh-${VERSION}.apk"
          fi
          cp android/app/build/outputs/apk/debug/app-debug.apk "out/searchhh-${VERSION}-debug.apk"
          ls -lh out

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: searchhh-apk-${{ github.ref_name }}
          path: out/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
          generate_release_notes: true
          body: |
            ## SEARCHHH ${{ github.ref_name }}

            Install `searchhh-${{ github.ref_name }}-debug.apk` on any Android 8.0+ device
            (debug-signed, side-loading required).

            The app works offline out of the box; point it at a running backend from
            **Settings → Change URL** (emulator loopback: `http://10.0.2.2:8000/`).
