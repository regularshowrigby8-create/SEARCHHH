name: Debug APK milestone
# Hosted debug artifact retrieval is intentionally external to this workflow.
on:
  push:
    branches: [arena/01a0ea36-searchhh]
    paths:
      - 'app/**'
      - 'ad-filter/**'
      - 'adblock-client/**'
      - 'backend/**'
      - 'gradle/**'
      - '*.gradle*'
      - 'gradlew*'
      - '.github/workflows/debug-apk-milestone.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: debug-apk-${{ github.ref }}
  cancel-in-progress: true
jobs:
  debug-apk:
    name: Build and verify debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with: {fetch-depth: 1}
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile debug Kotlin
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :app:compileDebugKotlin \
            --no-configuration-cache --stacktrace --max-workers=2 \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:+UseParallelGC" 2>&1 | tee debug-compile.log
      - name: Run app JVM unit tests
        shell: bash
        run: |
          ./gradlew :app:testDebugUnitTest --no-configuration-cache --stacktrace --max-workers=2 \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:+UseParallelGC" 2>&1 | tee debug-app-tests.log
      - name: Surface app test failure in job summary
        if: failure()
        shell: bash
        run: |
          if [ -f debug-app-tests.log ]; then
            {
              echo "## app JVM test failure — extracted root diagnostics"
              echo
              echo '```text'
              grep -E -C 2 'Execution failed for task|What went wrong|Caused by:|There were failing tests|FAILED|AssertionError|NoClassDefFoundError|Exception|Error:' debug-app-tests.log | head -240 || tail -120 debug-app-tests.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Run ad-filter JVM unit tests
        shell: bash
        run: |
          ./gradlew :ad-filter:testDebugUnitTest --no-configuration-cache --stacktrace --max-workers=2 \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:+UseParallelGC" 2>&1 | tee debug-ad-filter-tests.log
      - name: Run adblock-client JVM unit tests
        shell: bash
        run: |
          ./gradlew :adblock-client:testDebugUnitTest --no-configuration-cache --stacktrace --max-workers=2 \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:+UseParallelGC" 2>&1 | tee debug-adblock-tests.log
      - name: Assemble debug APK
        run: |
          ./gradlew :app:assembleDebug --no-configuration-cache --max-workers=2 \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:+UseParallelGC"
      - name: Collect APK and checksum
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p debug-delivery
          mapfile -t apks < <(find app/build/outputs/apk -type f -name '*.apk' | sort)
          test "${#apks[@]}" -gt 0
          for apk in "${apks[@]}"; do cp "$apk" debug-delivery/; done
          (cd debug-delivery && sha256sum ./*.apk > SHA256SUMS)
          printf '%s\n' 'This is a debug milestone artifact. It is not release-approved, signed for production, or a release APK.' > debug-delivery/README.txt
      - name: Upload debug APK milestone
        uses: actions/upload-artifact@v7
        with:
          name: searchhh-debug-apk-${{ github.sha }}
          path: debug-delivery/
          if-no-files-found: error
      - name: Publish debug APK through GitHub release assets
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: debug-apk-${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            debug-delivery/*.apk debug-delivery/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --prerelease \
            --title "Debug APK milestone $GITHUB_SHA" \
            --notes "Hosted debug transport artifact only. Not release-approved or production-signed."
      - name: Publish debug bundle through external transfer relay
        if: success()
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          tar -czf debug-delivery.tar.gz -C debug-delivery .
          response=$(curl --fail-with-body --retry 3 --retry-delay 5 \
            -F "file=@debug-delivery.tar.gz" \
            'https://file.io/?expires=1d')
          {
            echo "## External debug bundle relay"
            echo
            echo 'The hosted runner uploaded the debug bundle to file.io. This is a temporary transport URL, not a release approval.'
            echo
            echo '```json'
            echo "$response"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Publish debug failure tail
        if: failure()
        shell: bash
        run: |
          for log in debug-compile.log debug-app-tests.log debug-ad-filter-tests.log debug-adblock-tests.log debug-build.log; do
            if [ -f "$log" ]; then
              { echo "## $log failure tail"; echo; tail -120 "$log"; } >> "$GITHUB_STEP_SUMMARY"
            fi
          done
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: debug-apk-test-evidence-${{ github.sha }}
          path: |
            debug-compile.log
            debug-app-tests.log
            debug-ad-filter-tests.log
            debug-adblock-tests.log
            app/build/test-results/
            app/build/reports/tests/
            app/build/reports/problems/
          if-no-files-found: warn
