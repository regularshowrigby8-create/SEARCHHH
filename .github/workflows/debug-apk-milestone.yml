name: Debug APK milestone
on:
  push:
    branches: [arena/01a0ea36-searchhh]
    paths:
      - 'app/**'
      - 'ad-filter/**'
      - 'adblock-client/**'
      - 'backend/**'
      - 'gradle/**'
      - '*.gradle*'
      - 'gradlew*'
      - '.github/workflows/debug-apk-milestone.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: debug-apk-${{ github.ref }}
  cancel-in-progress: true
jobs:
  debug-apk:
    name: Build and verify debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with: {fetch-depth: 1}
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile and run JVM tests
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :app:compileDebugKotlin :app:testDebugUnitTest \
            :ad-filter:testDebugUnitTest :adblock-client:testDebugUnitTest \
            --no-configuration-cache --stacktrace --max-workers=2 \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:+UseParallelGC" 2>&1 | tee debug-build.log
      - name: Assemble debug APK
        run: |
          ./gradlew :app:assembleDebug --no-configuration-cache --max-workers=2 \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:+UseParallelGC"
      - name: Collect APK and checksum
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p debug-delivery
          mapfile -t apks < <(find app/build/outputs/apk -type f -name '*.apk' | sort)
          test "${#apks[@]}" -gt 0
          for apk in "${apks[@]}"; do cp "$apk" debug-delivery/; done
          (cd debug-delivery && sha256sum ./*.apk > SHA256SUMS)
          printf '%s\n' 'This is a debug milestone artifact. It is not release-approved, signed for production, or a release APK.' > debug-delivery/README.txt
      - name: Upload debug APK milestone
        uses: actions/upload-artifact@v7
        with:
          name: searchhh-debug-apk-${{ github.sha }}
          path: debug-delivery/
          if-no-files-found: error
      - name: Publish debug failure tail
        if: failure()
        shell: bash
        run: |
          if [ -f debug-build.log ]; then
            { echo "## Debug APK failure tail"; echo; tail -200 debug-build.log; } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: debug-apk-test-evidence-${{ github.sha }}
          path: |
            debug-build.log
            app/build/test-results/
            app/build/reports/tests/
            app/build/reports/problems/
          if-no-files-found: warn
