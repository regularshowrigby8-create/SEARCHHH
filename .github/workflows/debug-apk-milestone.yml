name: Debug APK milestone
on:
  push:
    branches: [arena/01a0ea36-searchhh]
    paths:
      - 'app/**'
      - 'ad-filter/**'
      - 'adblock-client/**'
      - 'backend/**'
      - 'gradle/**'
      - '*.gradle*'
      - 'gradlew*'
      - '.github/workflows/debug-apk-milestone.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: debug-apk-${{ github.ref }}
  cancel-in-progress: true
jobs:
  debug-apk:
    name: Build and verify debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with: {fetch-depth: 1}
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile debug Kotlin
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :app:compileDebugKotlin \
            --no-configuration-cache --stacktrace --max-workers=2 \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:+UseParallelGC" 2>&1 | tee debug-compile.log
      - name: Run app JVM unit tests
        if: success()
        continue-on-error: true
        id: app-tests
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :app:testDebugUnitTest --no-configuration-cache --stacktrace --max-workers=2 \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:+UseParallelGC" 2>&1 | tee debug-app-tests.log
          status=${PIPESTATUS[0]}
          printf '%s\n' "$status" > debug-app-status.txt
          exit 0
      - name: Run ad-filter JVM unit tests
        if: always()
        continue-on-error: true
        id: ad-filter-tests
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :ad-filter:testDebugUnitTest --no-configuration-cache --stacktrace --max-workers=2 \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:+UseParallelGC" 2>&1 | tee debug-ad-filter-tests.log
          status=${PIPESTATUS[0]}
          printf '%s\n' "$status" > debug-ad-filter-status.txt
          exit 0
      - name: Run adblock-client JVM unit tests
        if: always()
        continue-on-error: true
        id: adblock-tests
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :adblock-client:testDebugUnitTest --no-configuration-cache --stacktrace --max-workers=2 \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:+UseParallelGC" 2>&1 | tee debug-adblock-tests.log
          status=${PIPESTATUS[0]}
          printf '%s\n' "$status" > debug-adblock-status.txt
          exit 0
      - name: Enforce JVM test result
        if: always()
        id: test-gate
        shell: bash
        run: |
          set -u
          app=$(cat debug-app-status.txt 2>/dev/null || echo missing)
          ad_filter=$(cat debug-ad-filter-status.txt 2>/dev/null || echo missing)
          adblock=$(cat debug-adblock-status.txt 2>/dev/null || echo missing)
          {
            echo "## JVM test status"
            echo
            echo "app: $app"
            echo "ad-filter: $ad_filter"
            echo "adblock-client: $adblock"
          } >> "$GITHUB_STEP_SUMMARY"
          test "$app" = 0
          test "$ad_filter" = 0
          test "$adblock" = 0
      - name: Assemble debug APK
        if: steps.test-gate.outcome == 'success'
        run: |
          ./gradlew :app:assembleDebug --no-configuration-cache --max-workers=2 \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:+UseParallelGC"
      - name: Collect APK and checksum
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p debug-delivery
          mapfile -t apks < <(find app/build/outputs/apk -type f -name '*.apk' | sort)
          test "${#apks[@]}" -gt 0
          for apk in "${apks[@]}"; do cp "$apk" debug-delivery/; done
          (cd debug-delivery && sha256sum ./*.apk > SHA256SUMS)
          printf '%s\n' 'This is a debug milestone artifact. It is not release-approved, signed for production, or a release APK.' > debug-delivery/README.txt
      - name: Upload debug APK milestone
        uses: actions/upload-artifact@v7
        with:
          name: searchhh-debug-apk-${{ github.sha }}
          path: debug-delivery/
          if-no-files-found: error
      - name: Publish debug failure tail
        if: failure()
        shell: bash
        run: |
          for log in debug-compile.log debug-tests.log debug-app-tests.log debug-ad-filter-tests.log debug-adblock-tests.log debug-build.log; do
            if [ -f "$log" ]; then
              { echo "## $log failure tail"; echo; tail -120 "$log"; } >> "$GITHUB_STEP_SUMMARY"
            fi
          done
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: debug-apk-test-evidence-${{ github.sha }}
          path: |
            debug-compile.log
            debug-tests.log
            debug-app-tests.log
            debug-ad-filter-tests.log
            debug-adblock-tests.log
            debug-app-status.txt
            debug-ad-filter-status.txt
            debug-adblock-status.txt
            debug-build.log
            app/build/test-results/
            app/build/reports/tests/
            app/build/reports/problems/
          if-no-files-found: warn
