name: Retrieve hosted evidence
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: GitHub Actions run ID
        required: true
        type: string
      artifact:
        description: Artifact name to retrieve
        required: true
        type: string
permissions:
  actions: read
jobs:
  retrieve:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve artifact with retries and ZIP validation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 tools/quality/download_github_artifact.py \
            --repo "$GITHUB_REPOSITORY" \
            --run-id "${{ inputs.run_id }}" \
            --artifact "${{ inputs.artifact }}" \
            --output retrieved-evidence
      - name: Upload retrieved evidence
        uses: actions/upload-artifact@v4
        with:
          name: retrieved-${{ inputs.run_id }}-${{ inputs.artifact }}
          path: retrieved-evidence/
          if-no-files-found: error
