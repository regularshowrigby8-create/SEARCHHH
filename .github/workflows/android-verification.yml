name: Android verification
on:
  push:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  merge_group:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: android-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  policy-and-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v6
        with: {python-version: '3.11'}
      - name: Test the quality checker
        run: python3 -m unittest discover -s tools/quality/tests -v
      - name: Verify contributor acknowledgment
        run: python3 tools/quality/agreement.py
      - name: Verify inventory is current
        run: python3 tools/quality/interactions.py --check
      - name: Reject unfinished production and test code
        run: python3 tools/quality/unfinished.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: source-quality-${{ github.run_id }}
          path: build/reports/searchhh/
  android-host:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: formatting
            tasks: ktlintFormat
          - lane: detekt
            tasks: detekt
          - lane: release-checks
            tasks: ':app:verifyReleaseRuntimeDependencies :app:testReleaseUnitTest :app:lintRelease :app:minifyReleaseWithR8'
          - lane: build-test-lint
            tasks: ':app:compileDebugKotlin :app:testDebugUnitTest :ad-filter:testDebugUnitTest :adblock-client:testDebugUnitTest :app:lintDebug :ad-filter:lintDebug :adblock-client:lintDebug'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with: {distribution: zulu, java-version: '17'}
      - name: Provision required Android SDK packages
        uses: android-actions/setup-android@035682743ab223ec9c6169af09811dff8247e520
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
      - name: Verify imported Android SDK
        shell: bash
        run: |
          test -d "$ANDROID_HOME/platforms/android-36" || { echo '::error::Android SDK platform 36 was not provisioned'; exit 1; }
          test -x "$ANDROID_HOME/platform-tools/adb" || { echo '::error::Android platform tools were not provisioned'; exit 1; }
          "$ANDROID_HOME/platform-tools/adb" version
      - uses: gradle/actions/setup-gradle@v4
      - name: Execute strict checks
        shell: bash
        run: |
          set -o pipefail
          if [ "${{ matrix.lane }}" = "formatting" ]; then
            # KtLint may report non-autocorrectable findings while still applying
            # its bounded formatting changes. Preserve the diff for review.
            set +e
            ./gradlew --continue ${{ matrix.tasks }} -PuniversalApk --max-workers=2 -Dorg.gradle.jvmargs="-Xmx4g -XX:+UseParallelGC" 2>&1 | tee quality-${{ matrix.lane }}.log
            formatter_status=${PIPESTATUS[0]}
            set -e
            echo "KtLint formatter exit status: ${formatter_status}"
            exit 0
          fi
          ./gradlew --continue ${{ matrix.tasks }} -PuniversalApk --max-workers=2 -Dorg.gradle.jvmargs="-Xmx4g -XX:+UseParallelGC" 2>&1 | tee quality-${{ matrix.lane }}.log
      - name: Publish compact execution evidence
        if: always()
        run: python3 tools/quality/ci_summary.py
      - name: Packetize Detekt and KtLint findings
        if: always() && matrix.lane == 'detekt'
        shell: bash
        run: |
          mapfile -t DETEKT_REPORTS < <(find . -path '*/build/reports/detekt/*.xml' -o -path '*/build/reports/detekt/detekt.xml')
          mapfile -t KTLINT_REPORTS < <(find . -path '*/build/reports/ktlint/*/*.xml')
          args=(--output build/reports/factory/gradle-remediation-queue.json)
          for report in "${DETEKT_REPORTS[@]}"; do args+=(--detekt "$report"); done
          for report in "${KTLINT_REPORTS[@]}"; do args+=(--ktlint "$report"); done
          if [ "${#DETEKT_REPORTS[@]}" -eq 0 ] && [ "${#KTLINT_REPORTS[@]}" -eq 0 ]; then
            echo '{"status":"NO_REPORTS","release_approved":false}' > build/reports/factory/gradle-remediation-queue.json
          else
            python3 tools/factory/gradle_quality_queue.py "${args[@]}" || test -s build/reports/factory/gradle-remediation-queue.json
          fi
      - name: Publish exact findings to hosted job summary
        if: always() && matrix.lane == 'detekt'
        shell: bash
        run: |
          mkdir -p build/reports/factory
          mapfile -t DETEKT_REPORTS < <(find . -path '*/build/reports/detekt/*.xml' -o -path '*/build/reports/detekt/detekt.xml')
          mapfile -t KTLINT_REPORTS < <(find . -path '*/build/reports/ktlint/*/*.xml')
          args=(--output build/reports/factory/hosted-findings.md)
          for report in "${DETEKT_REPORTS[@]}"; do args+=(--detekt "$report"); done
          for report in "${KTLINT_REPORTS[@]}"; do args+=(--ktlint "$report"); done
          python3 tools/quality/publish_hosted_findings.py "${args[@]}"
          cat build/reports/factory/hosted-findings.md >> "$GITHUB_STEP_SUMMARY"
      - name: Commit formatting-only repair
        if: matrix.lane == 'formatting' && success()
        shell: bash
        run: |
          set -euo pipefail
          files=$(git diff --name-only)
          if [ -z "$files" ]; then echo "No formatting changes"; exit 0; fi
          while IFS= read -r file; do
            case "$file" in *.kt|*.kts) ;; *) echo "Unexpected non-Kotlin change: $file"; exit 1 ;; esac
          done <<< "$files"
          git config user.name searchhh-quality-bot
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- '*.kt' '*.kts'
          git diff --cached --quiet || (git commit -m 'Apply Gradle KtLint formatting repair [skip ci]' -m 'Searchhh-Quality-Policy: accepted-v1' && git push origin HEAD:${GITHUB_REF_NAME})
      - name: Annotate failure diagnostics
        if: failure()
        env:
          QUALITY_LANE: ${{ matrix.lane }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          path = Path('quality-' + os.environ['QUALITY_LANE'] + '.log')
          if path.exists():
              tail = path.read_text(errors='replace')[-6000:]
              print('::error title=Strict Android quality failed::' + tail.replace('%','%25').replace('\r','%0D').replace('\n','%0A'))
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: android-${{ matrix.lane }}-${{ github.run_id }}
          path: |
            **/build/reports/
            **/build/test-results/
            quality-*.log
  device-and-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: {python-version: '3.11'}
      - uses: actions/setup-java@v5
        with: {distribution: zulu, java-version: '17'}
      - name: Provision required Android SDK packages
        uses: android-actions/setup-android@035682743ab223ec9c6169af09811dff8247e520
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
      - name: Verify imported Android SDK
        shell: bash
        run: |
          test -d "$ANDROID_HOME/platforms/android-36" || { echo '::error::Android SDK platform 36 was not provisioned'; exit 1; }
          test -x "$ANDROID_HOME/platform-tools/adb" || { echo '::error::Android platform tools were not provisioned'; exit 1; }
          "$ANDROID_HOME/platform-tools/adb" version
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exercise full verification on Android 35
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          disable-animations: true
          script: |
            bash tools/quality/device_verification.sh
      - name: Publish compact execution evidence
        if: always()
        run: python3 tools/quality/ci_summary.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: device-quality-${{ github.run_id }}
          path: |
            **/build/reports/
            **/build/test-results/
            app/build/outputs/androidTest-results/
            quality-device.log
  required-quality:
    if: always()
    needs: [policy-and-source, android-host, device-and-evidence]
    runs-on: ubuntu-latest
    steps:
      - name: Reject any failed, cancelled or skipped required lane
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          results = json.loads(os.environ['RESULTS'])
          bad = {name: value['result'] for name, value in results.items() if value['result'] != 'success'}
          print(json.dumps(results, indent=2))
          sys.exit(1 if bad else 0)
          PY

  quality-summary:
    name: Quality summary
    if: always()
    needs: [policy-and-source, android-host, device-and-evidence, required-quality]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Generate fail-closed run summary
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          mkdir -p build/reports/factory
          python3 tools/factory/summarize_run.py \
            --needs "$NEEDS_JSON" \
            --output build/reports/factory/run-summary.json
      - name: Publish summary
        if: always()
        run: cat build/reports/factory/run-summary.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: factory-run-summary-${{ github.run_id }}
          path: build/reports/factory/run-summary.json

