# Adapted from plateaukao/einkbro v16.7.0 CI. Searchhh gates are sequential.
name: Searchhh checks and APK
on:
  push:
    branches: [arena/01a0ea36-searchhh]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  framework:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Retrieve previous build diagnostics
        if: github.run_number == 4
        uses: actions/download-artifact@v8
        with:
          name: android-test-reports
          run-id: 36498067174
          github-token: ${{ github.token }}
          path: previous
      - name: Expose previous Gradle failure
        if: github.run_number == 4
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          for p in Path('previous').rglob('android-build.log'):
              print('::notice title=Previous build log::' + p.read_text()[-3000:].replace('%','%25').replace('\n','%0A'))
          PYTHON
      - uses: actions/setup-python@v6
        with: {python-version: '3.11'}
      - uses: actions/setup-node@v6
        with: {node-version: '22'}
      - name: Test opportunity framework and security policy
        run: |
          pip install -r backend/requirements.txt
          PYTHONPATH=backend pytest backend/tests -q
      - name: Test reused browser JavaScript and locale resources
        run: |
          npm install --prefix js-tests --ignore-scripts
          npm test --prefix js-tests -- --runInBand
          python3 scripts/check_locale_strings.py
  backend-integration:
    needs: framework
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: {python-version: '3.11'}
      - name: Start upstream services and adapters
        working-directory: backend
        run: |
          printf 'POSTGRES_PASSWORD=%s\nSEARCHHH_ACCESS_TOKEN=%s\nSEARXNG_SECRET=%s\n' "$(openssl rand -hex 32)" "$(openssl rand -hex 32)" "$(openssl rand -hex 32)" > .env
          docker compose --env-file .env up -d --build
      - name: Exercise real PostgreSQL, Redis, RQ and SearXNG
        run: |
          pip install httpx==0.28.1
          python3 backend/tests/stack_smoke.py
      - name: Capture container diagnostics
        if: always()
        working-directory: backend
        run: docker compose --env-file .env logs --no-color > stack.log
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: backend-diagnostics
          path: backend/stack.log
      - name: Stop test services
        if: always()
        working-directory: backend
        run: docker compose --env-file .env down -v
  android:
    needs: backend-integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '17'
          cache: gradle
      - name: Test, lint, then assemble installable universal test APK
        shell: bash
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug -PuniversalApk --max-workers=2 -Dorg.gradle.jvmargs="-Xmx4g -XX:+UseParallelGC" 2>&1 | tee android-build.log
      - name: Report build failure diagnostics
        if: failure()
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          p = Path('android-build.log')
          if p.exists():
              text = p.read_text(errors='replace')[-3000:]
              print('::error title=Android build diagnostics::' + text.replace('%','%25').replace('\r','%0D').replace('\n','%0A'))
          PYTHON
      - name: Upload APK and reports
        uses: actions/upload-artifact@v7
        with:
          name: searchhh-debug-apk
          path: app/build/outputs/apk/debug/app-universal-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: android-test-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
            android-build.log
  device-smoke:
    needs: android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: searchhh-debug-apk
          path: apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and launch on Android 35
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          disable-animations: true
          script: |
            adb install apk/app-universal-debug.apk
            adb logcat -c
            adb shell am start -W -n app.searchhh.browser/info.plateaukao.einkbro.searchhh.SearchhhActivity
            sleep 5
            adb shell pidof app.searchhh.browser
            adb shell uiautomator dump /sdcard/searchhh-ui.xml
            adb pull /sdcard/searchhh-ui.xml searchhh-ui.xml
            grep -q 'Less noise.' searchhh-ui.xml
            adb exec-out screencap -p > searchhh-screen.png
            adb logcat -d -b crash > crash.log
            test ! -s crash.log
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: device-smoke
          path: |
            searchhh-screen.png
            searchhh-ui.xml
            crash.log

  publish-test-apk:
    needs: device-smoke
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: searchhh-debug-apk
          path: apk
      - name: Publish tested APK using GitHub CLI
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mv apk/app-universal-debug.apk apk/searchhh-0.1.0-test.apk
          sha256sum apk/searchhh-0.1.0-test.apk > apk/SHA256SUMS
          gh release create "v0.1.0-test-${GITHUB_RUN_NUMBER}" \
            --target "$GITHUB_SHA" --prerelease \
            --title "Searchhh 0.1.0 — tested development APK" \
            --notes "Reuse-first development build based on EinkBro. 33 configured keyless SearXNG adapters. Opportunity swarms require a separately deployed HTTPS backend; see the README at this release commit. Debug signed, not a production release. Framework tests, real service integration, Android unit tests/lint, and emulator launch smoke must pass before this release is published. AI mode is not implemented." \
            apk/searchhh-0.1.0-test.apk apk/SHA256SUMS
