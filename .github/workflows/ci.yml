# ---------------------------------------------------------------------------
# CI - runs on every push to every branch (including arena/*) and on PRs.
#
#   backend   : ruff + pytest + coverage gate + stack audit
#   android   : unit tests, lint, debug APK (uploaded as an artifact)
#
# No secrets are required: the app and the API both run in offline/demo mode.
# ---------------------------------------------------------------------------
name: CI

on:
  push:
    branches: ["**"]
    tags-ignore: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  GRADLE_VERSION: "8.10.2"

jobs:
  # ------------------------------------------------------------------------
  backend:
    name: Backend (lint, tests, coverage, stack audit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt

      - name: Ruff lint
        run: python -m ruff check backend

      - name: Ruff format check
        run: python -m ruff format --check backend

      - name: Pytest + coverage
        run: |
          python -m pytest backend/tests -q \
            --cov=backend/app \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=80

      - name: Stack audit (118 tools must all resolve)
        run: python scripts/scan_stack.py --check

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: coverage.xml
          if-no-files-found: warn

  # ------------------------------------------------------------------------
  android:
    name: Android (unit tests, lint, APK)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Ensure Android SDK packages
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "Android SDK: $SDK_ROOT"
          SDKM="$(ls -d "$SDK_ROOT"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)"
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" "platform-tools" "platforms;android-35" "build-tools;35.0.0" > /dev/null

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
          cache-read-only: false

      - name: Unit tests
        working-directory: android
        run: |
          set -o pipefail
          gradle :app:testDebugUnitTest --stacktrace --console=plain 2>&1 | tee gradle.log

      - name: Lint
        working-directory: android
        run: |
          set -o pipefail
          gradle :app:lintDebug --stacktrace --console=plain 2>&1 | tee -a gradle.log

      - name: Assemble debug APK
        working-directory: android
        run: |
          set -o pipefail
          gradle :app:assembleDebug --stacktrace --console=plain 2>&1 | tee -a gradle.log

      # The Actions log endpoint is not reachable from every network; emitting
      # compiler errors as annotations makes them readable through the Checks API.
      - name: Surface build errors as annotations
        if: failure()
        working-directory: android
        run: |
          if [ ! -f gradle.log ]; then
            echo "::error title=CI::gradle.log was not produced - the failure happened before Gradle ran"
            exit 0
          fi
          grep -E "^(e: |w: .*error|FAILURE:|\* What went wrong:|Execution failed|> Task .* FAILED)" gradle.log \
            | head -40 \
            | while IFS= read -r line; do
                clean=$(printf '%s' "$line" | tr -d '\r' | cut -c1-900)
                echo "::error title=Gradle::$clean"
              done

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: searchhh-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: |
            android/app/build/reports/tests/**
            android/app/build/reports/lint-results-debug.html
          if-no-files-found: warn
          retention-days: 14
