name: searchhh
services:
  api:
    build: .
    ports: ["127.0.0.1:8000:8000"]
    environment: &environment
      DATABASE_URL: postgresql+psycopg://searchhh:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres/searchhh
      REDIS_URL: redis://redis:6379/0
      SEARXNG_URL: http://searxng:8080
      SEARCHHH_ACCESS_TOKEN: ${SEARCHHH_ACCESS_TOKEN:?set SEARCHHH_ACCESS_TOKEN}
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    restart: unless-stopped
  worker:
    build: .
    command: ["rq", "worker", "--url", "redis://redis:6379/0", "--with-scheduler", "searchhh"]
    environment: *environment
    depends_on:
      api: {condition: service_started}
      searxng: {condition: service_started}
    restart: unless-stopped
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: searchhh
      POSTGRES_USER: searchhh
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes: ["postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U searchhh"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redis:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
  searxng:
    image: docker.io/searxng/searxng:${SEARXNG_VERSION:-latest}
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:?set SEARXNG_SECRET}
    volumes: ["./config/searxng.yml:/etc/searxng/settings.yml:ro"]
    restart: unless-stopped
volumes:
  postgres:
  redis:
